# Created by riko chen on 2026-10-17
# NetworkManager gives wlan0 a random MAC address for its scans and restores it afterwards, so at
# boot it changes the address twice before the relay's access point can start. wlan0 hosts that
# access point or joins Wi-Fi the user saved; scanning keeps the device's own address.
[device-openxplay-wlan0]
match-device=interface-name:wlan0
wifi.scan-rand-mac-address=no
