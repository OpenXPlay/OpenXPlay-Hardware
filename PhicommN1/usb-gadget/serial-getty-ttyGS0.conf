# Drop-in for serial-getty@ttyGS0.service: the console lives and dies with the USB gadget, and is
# stopped before it, because the gadget cannot remove its serial function while ttyGS0 is open.
[Unit]
BindsTo=openxplay-usb-gadget.service
After=openxplay-usb-gadget.service
